<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initiative Maki</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--ink:#1e2941;--paper:#fffaf4;--violet:#6c4ce6;--coral:#ff775f;--sun:#ffc83d;--mint:#62d5bc;--blue:#59a8ff;--line:#e8e1d8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,sans-serif}.shell{max-width:1280px;margin:auto;padding:28px}.brand{display:flex;gap:14px;align-items:center}.mark{width:52px;height:52px;border-radius:17px;background:var(--violet);color:white;display:grid;place-items:center;font:bold 30px Georgia}.brand h1{font:800 28px/1 Georgia;margin:0}.brand p{margin:5px 0 0;color:#667085}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:25px}.date-pill,.tag{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-weight:700}.date-pill:before{content:'●';color:var(--coral);margin-right:8px}.board{display:grid;grid-template-columns:275px 1fr;gap:18px}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 30px #725b3a0b}.students-head{display:flex;justify-content:space-between;align-items:center}.students-head h2,.detail h2{margin:0;font:800 22px Georgia}.student{width:100%;border:0;background:transparent;padding:13px 10px;text-align:left;border-radius:13px;color:var(--ink);cursor:pointer;margin-top:7px}.student:hover,.student.active{background:#f0ecff}.student b,.student small{display:block}.student small{color:#667085;margin-top:2px}.add,button.primary{border:0;background:var(--violet);color:white;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.add{font-size:20px;padding:4px 10px}.empty{color:#667085;padding:26px 4px}.detail-top{display:flex;justify-content:space-between;align-items:start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:18px}.detail-top p{margin:4px 0 0;color:#667085}.level{background:var(--sun);padding:5px 10px;border-radius:99px;font-weight:800}.note-intro{background:#e8fbf5;border-radius:13px;padding:11px 13px;margin:18px 0;color:#24574a}.topics{display:grid;gap:10px}.topic{display:grid;grid-template-columns:minmax(0,1fr) 155px 38px;gap:9px}.topic input,.topic select,textarea,input{border:1px solid var(--line);border-radius:10px;padding:11px;background:white;color:var(--ink);font:inherit;width:100%}.remove{border:0;background:#ffe4df;color:#a53529;border-radius:10px;font-size:22px;cursor:pointer}.minor{border:1px dashed #bfc7d3;background:white;border-radius:10px;padding:10px;color:var(--violet);font-weight:800;cursor:pointer;margin-top:11px}.field{display:grid;gap:7px;font-weight:800;margin-top:18px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.danger{border:0;background:none;color:#b43b2e;font-weight:800;cursor:pointer}.primary{padding:12px 17px}.history{margin-top:18px}.history-head{display:flex;justify-content:space-between;align-items:center}.history-head h2{font:800 22px Georgia}.history-switch button{border:0;background:#f0ecff;color:var(--violet);padding:8px 10px;font-weight:800;cursor:pointer}.history-switch button.active{background:var(--violet);color:white}.history-list{display:grid;gap:10px}.entry{border-left:5px solid var(--coral);background:#fff6e8;padding:13px;border-radius:10px}.entry b{display:block}.entry small{color:#667085}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{background:white;border:1px solid #f2d7a0;padding:4px 7px;border-radius:999px;font-size:.85rem}.login{max-width:440px;margin:80px auto}.login h1{font:800 34px Georgia}.login .mark{margin-bottom:18px}.login p{color:#667085}.login form{display:grid;gap:12px}.error{color:#b43b2e;font-weight:700;margin-top:10px}.toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:white;padding:12px 15px;border-radius:10px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:800px){.shell{padding:16px}.top,.detail-top{align-items:start;flex-direction:column}.board{grid-template-columns:1fr}.topic{grid-template-columns:1fr 1fr 38px}}</style></head><body><main class="shell"><section id="login" class="login panel"><div class="mark">M</div><h1>Initiative Maki</h1><p>Ton carnet de suivi pédagogique, privé et daté.</p><form id="login-form"><input id="email" type="email" required placeholder="Ton e-mail"><button class="primary">Recevoir un lien de connexion</button></form><p id="login-msg"></p></section><section id="app" hidden><header class="top"><div class="brand"><div class="mark">M</div><div><h1>Initiative Maki</h1><p>Une trace claire, élève par élève.</p></div></div><div class="date-pill" id="today"></div></header><div class="board"><aside class="panel"><div class="students-head"><h2>Élèves</h2><button class="add" id="add-student" title="Ajouter un élève">+</button></div><div id="students"></div></aside><section class="panel detail" id="detail"><div class="empty">Ajoute ton premier élève pour démarrer.</div></section></div><section class="panel history"><div class="history-head"><h2>Historique</h2><div class="history-switch"><button class="active" data-history="student">Par élève</button><button data-history="date">Par date</button></div></div><div id="history-list" class="history-list"><p class="empty">Sélectionne un élève.</p></div></section></section></main><div id="toast" class="toast"></div><script>const SUPABASE_URL='https://xosedyvtnngsifyzbseq.supabase.co',KEY='sb_publishable_RTjF3AeqyGsSifxwulrDCQ_z6RF2r1d',db=supabase.createClient(SUPABASE_URL,KEY),$=s=>document.querySelector(s),today=new Date().toISOString().slice(0,10);let students=[],active=null,historyMode='student';$('#today').textContent=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());const toast=x=>{let e=$('#toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)};const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function boot(){let{data:{session}}=await db.auth.getSession();$('#login').hidden=!!session;$('#app').hidden=!session;if(session)await loadStudents()}async function loadStudents(){let{data,error}=await db.from('students').select('*').is('archived_at',null).order('name');if(error)return fail(error);students=data||[];if(!active&&students[0])active=students[0];if(active&&!students.find(s=>s.id===active.id))active=students[0]||null;renderStudents();await renderDetail();await renderHistory()}function renderStudents(){$('#students').innerHTML=students.length?students.map(s=>`<button class="student ${active?.id===s.id?'active':''}" data-id="${s.id}"><b>${esc(s.name)}</b><small>${esc(s.level)}</small></button>`).join(''):'<p class="empty">Pas encore d’élève.</p>';document.querySelectorAll('.student').forEach(b=>b.onclick=async()=>{active=students.find(s=>s.id===b.dataset.id);renderStudents();await renderDetail();await renderHistory()})}function topicRow(t={chapter:'',assessment:'En cours'}){return `<div class="topic"><input class="chapter" value="${esc(t.chapter)}" placeholder="Chapitre travaillé"><select class="assessment">${['Très bien','Bien','En cours','À reprendre','Difficile'].map(x=>`<option ${x===t.assessment?'selected':''}>${x}</option>`).join('')}</select><button class="remove" title="Retirer">×</button></div>`}async function renderDetail(){if(!active){$('#detail').innerHTML='<div class="empty">Ajoute ton premier élève pour démarrer.</div>';return}let{data:log,error}=await db.from('daily_logs').select('*,log_topics(*)').eq('student_id',active.id).eq('log_date',today).maybeSingle();if(error)return fail(error);let topics=log?.log_topics||[];$('#detail').innerHTML=`<div class="detail-top"><div><h2>${esc(active.name)}</h2><p>Fiche du ${new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long'}).format(new Date(today))}</p></div><span class="level">${esc(active.level)}</span></div><p class="note-intro">Une fiche par jour : ajoute autant de chapitres que nécessaire, puis garde une observation générale.</p><div id="topics" class="topics">${topics.length?topics.map(topicRow).join(''):topicRow()}</div><button id="add-topic" class="minor">+ Ajouter un chapitre</button><label class="field">Observation générale<textarea id="observation" rows="4" placeholder="Ce qui a réussi, ce qui a bloqué, une stratégie repérée…">${esc(log?.observation||'')}</textarea></label><div class="actions"><button id="delete-student" class="danger">Supprimer cet élève</button><button id="save" class="primary">Enregistrer la fiche du jour</button></div>`;$('#add-topic').onclick=()=>{ $('#topics').insertAdjacentHTML('beforeend',topicRow());bindRemove()};bindRemove();$('#save').onclick=()=>saveLog(log?.id);$('#delete-student').onclick=()=>deleteStudent()}function bindRemove(){document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{if(document.querySelectorAll('.topic').length>1)b.parentElement.remove()})}async function saveLog(existing){let rows=[...document.querySelectorAll('.topic')].map(r=>({chapter:r.querySelector('.chapter').value.trim(),assessment:r.querySelector('.assessment').value})).filter(x=>x.chapter);if(!rows.length)return toast('Ajoute au moins un chapitre.');let payload={student_id:active.id,log_date:today,observation:$('#observation').value.trim(),updated_at:new Date().toISOString()};let{data:log,error}=existing?await db.from('daily_logs').update(payload).eq('id',existing).select().single():await db.from('daily_logs').insert(payload).select().single();if(error)return fail(error);let{error:del}=await db.from('log_topics').delete().eq('daily_log_id',log.id);if(del)return fail(del);let{error:ins}=await db.from('log_topics').insert(rows.map(x=>({...x,daily_log_id:log.id})));if(ins)return fail(ins);toast('Fiche enregistrée.');await renderDetail();await renderHistory()}async function deleteStudent(){if(!confirm('Supprimer cet élève et son historique ?'))return;let{error}=await db.from('students').delete().eq('id',active.id);if(error)return fail(error);active=null;toast('Élève supprimé.');await loadStudents()}async function renderHistory(){let el=$('#history-list');if(historyMode==='student'){if(!active){el.innerHTML='<p class="empty">Sélectionne un élève.</p>';return}let{data,error}=await db.from('daily_logs').select('*,log_topics(*)').eq('student_id',active.id).order('log_date',{ascending:false});if(error)return fail(error);el.innerHTML=(data||[]).length?data.map(entry).join(''):'<p class="empty">Aucune fiche enregistrée pour cet élève.</p>'}else{let{data,error}=await db.from('daily_logs').select('*,students(name,level),log_topics(*)').eq('log_date',today).order('created_at');if(error)return fail(error);el.innerHTML=(data||[]).length?data.map(x=>entry(x,`<b>${esc(x.students?.name||'Élève')} · ${esc(x.students?.level||'')}</b>`)).join(''):'<p class="empty">Aucune fiche enregistrée aujourd’hui.</p>'}}function entry(x,prefix=''){let date=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'}).format(new Date(x.log_date));return `<article class="entry">${prefix}<b>${date}</b><div class="chips">${(x.log_topics||[]).map(t=>`<span class="chip">${esc(t.chapter)} · ${esc(t.assessment)}</span>`).join('')}</div>${x.observation?`<small>${esc(x.observation)}</small>`:''}</article>`}function fail(e){console.error(e);toast('Erreur : '+e.message)}$('#add-student').onclick=async()=>{let name=prompt('Prénom ou pseudonyme de l’élève');if(!name)return;let level=prompt('Niveau (ex. 5e, 4e, Seconde)', '5e');if(!level)return;let{data,error}=await db.from('students').insert({name,level}).select().single();if(error)return fail(error);active=data;toast('Élève ajouté.');await loadStudents()};document.querySelectorAll('[data-history]').forEach(b=>b.onclick=async()=>{historyMode=b.dataset.history;document.querySelectorAll('[data-history]').forEach(x=>x.classList.toggle('active',x===b));await renderHistory()});$('#login-form').onsubmit=async e=>{e.preventDefault();let{error}=await db.auth.signInWithOtp({email:$('#email').value,options:{emailRedirectTo:location.href}});$('#login-msg').textContent=error?'Erreur : '+error.message:'Lien envoyé : ouvre-le pour entrer dans Initiative Maki.'};db.auth.onAuthStateChange(()=>boot());boot();</script></body></html>
